[package]
name = "polycanv-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "런처 — 도구를 골라 새 패인에서 실행. 도구 목록은 설정으로 확장한다."

[lib]
name = "polycanv_launcher"

# zellij 가 로드하는 wasm 은 바이너리 크레이트여야 한다 (cdylib 은 `_start` 가 없어 로드 실패).
[[bin]]
name = "polycanv-launcher"
path = "src/main.rs"

[dependencies]
polycanv-protocol = { path = "../../crates/protocol" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zellij-tile = "0.44.3"
polycanv-protocol = { path = "../../crates/protocol", features = ["zellij"] }

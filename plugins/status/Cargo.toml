[package]
name = "polycanv-status"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "터미널별 running/waiting/finished/idle 판별 → 신호등 신호"

[lib]
name = "polycanv_status"

# ★ zellij 가 로드하는 wasm 은 **바이너리 크레이트**여야 한다.
#   cdylib 으로 만들면 `_start` 가 없어 빌드는 성공하고 로드만 실패한다.
[[bin]]
name = "polycanv-status"
path = "src/main.rs"

[dependencies]
polycanv-protocol = { path = "../../crates/protocol" }
serde = { workspace = true }
serde_json = { workspace = true }

# zellij-tile 은 wasm 타깃에서만 링크된다. 호스트에서는 host_run_plugin_command 심볼이 없어
# 링크가 깨지므로, 순수 로직(adapters)만 호스트에서 `cargo test` 로 돌린다.
[target.'cfg(target_arch = "wasm32")'.dependencies]
zellij-tile = "0.44.3"
polycanv-protocol = { path = "../../crates/protocol", features = ["zellij"] }

[workspace]
resolver = "2"
members = ["crates/protocol", "plugins/launcher", "plugins/sidebar", "plugins/status"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/maengyo/polycanv"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[project]
name = "polycanv"
version = "0.1.0"
description = "Gather your scattered coding sessions onto one canvas"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "maengyo" }]
keywords = ["terminal", "tui", "multiplexer", "canvas", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

# 의존성을 적게 유지한다. 하나 늘 때마다 `uv tool install` 이 느려지고 깨질 표면이 넓어진다.
dependencies = [
    "textual>=8.0",   # TUI. 절대 좌표 배치와 마우스를 둘 다 준다 — 자유 캔버스의 전제
    "pyte>=0.8",      # 터미널 에뮬레이션. PTY 가 뱉는 ANSI 를 화면 상태로 바꾼다
    'tomli>=2.0; python_version < "3.11"',  # 3.11 부터는 표준 tomllib 을 쓴다
]

[project.optional-dependencies]
web = ["textual-serve>=1.1"]   # 브라우저로 열기. WSL·원격에서 쓴다

[project.scripts]
polycanv = "polycanv.__main__:main"

[project.urls]
Homepage = "https://github.com/maengyo/polycanv"
Issues = "https://github.com/maengyo/polycanv/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polycanv"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

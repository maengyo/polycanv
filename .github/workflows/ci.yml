name: CI

# 세 OS 는 동등하다. Windows 를 "나중에" 로 미루면 조용히 깨진다.
#
# ⚠️ Windows 는 PTY 가 다르다 — `pty` 모듈이 유닉스 전용이라 터미널 구동 자체가
#    지금은 불가능하다. 그래도 매트릭스에 남겨 **무엇이 안 되는지 눈에 보이게** 한다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 테스트 (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc      # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - name: 테스트
        run: uv run pytest -q
      - name: 린트
        run: uv run ruff check .
      - name: 포맷
        run: uv run ruff format --check .

  install:
    name: uv tool install 이 실제로 되는가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc      # v6

      # 이 프로젝트의 약속은 "한 명령으로 설치된다" 이다.
      # 빌드가 되는 것과 설치가 되는 것은 다르므로 여기서 실제로 설치해 본다.
      - name: 빌드
        run: uv build
      - name: 설치
        run: uv tool install ./dist/*.whl
      - name: 실행 파일이 생겼는가
        run: |
          command -v polycanv || { echo "::error::polycanv 명령이 없다"; exit 1; }
          echo "설치 확인: $(command -v polycanv)"
